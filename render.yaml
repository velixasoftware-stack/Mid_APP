services:
  - type: web
    name: mid-app
    runtime: node
    region: singapore # closest Render region to the Mumbai (ap-south-1) database
    plan: free
    buildCommand: npm install --include=dev --prefix Mid-APP/client && npm run build --prefix Mid-APP/client && npm install --prefix Mid-APP/server
    startCommand: npm start --prefix Mid-APP/server
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: CHIEF_ADMIN_USERNAME
        value: chiefadmin
      - key: CHIEF_ADMIN_PASSWORD
        sync: false
      - key: RAZORPAY_KEY_ID
        value: ""
      - key: RAZORPAY_KEY_SECRET
        value: ""
      - key: RAZORPAY_WEBHOOK_SECRET
        value: ""
